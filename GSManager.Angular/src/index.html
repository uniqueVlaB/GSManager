<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GSManagerAngular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root>
    <div class="app-init-loader" aria-live="polite" aria-label="Application loading">
      <div class="app-init-loader__spinner" role="status"></div>
      <p class="app-init-loader__text">Loading&hellip;</p>
    </div>
  </app-root>
</body>

<style>
  .app-init-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    gap: 1rem;
    background-color: #f8fafc;
    font-family: Roboto, sans-serif;
  }

  .app-init-loader__spinner {
    width: 52px;
    height: 52px;
    border: 4px solid #dcfce7;
    border-top-color: #15803d;
    border-radius: 50%;
    animation: app-init-spin 0.8s linear infinite;
  }

  .app-init-loader__text {
    margin: 0;
    font-size: 0.95rem;
    color: #64748b;
    letter-spacing: 0.02em;
  }

  @keyframes app-init-spin {
    to { transform: rotate(360deg); }
  }
</style>
</html>
